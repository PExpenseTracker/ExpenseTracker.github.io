<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Finance Dashboard</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">

    <div class="dashboard-container">
        
        <!-- Dashboard Header -->
        <header class="dashboard-header">
            <div class="brand-logo">
                <span class="logo-icon">💼</span>
                <span class="logo-text" id="profileAccountName">Krazy Doom</span>
            </div>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
                <!-- Account Switcher -->
                <select id="accountSwitchSelect" class="filter-select" style="width: 105px;">
                    <option value="Krazy Doom">Krazy Doom</option>
                    <option value="Krazy Ellie">Krazy Ellie</option>
                </select>
                <!-- Logout Button -->
                <button id="logoutBtn" class="logout-icon-btn" title="Log Out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Views Container -->
        <main class="views-container">

            <!-- TAB 1: HOME VIEW -->
            <div id="viewHome" class="tab-view active">
                
                <!-- Summary Cards -->
                <div class="summary-cards">
                    <div class="summary-card">
                        <span class="card-label">Income</span>
                        <span id="totalIncome" class="card-amount positive">+₱0.00</span>
                    </div>
                    <div class="summary-card">
                        <span class="card-label">Expenses</span>
                        <span id="totalExpenses" class="card-amount negative">-₱0.00</span>
                    </div>
                    <div class="summary-card">
                        <span class="card-label">Balance</span>
                        <span id="totalBalance" class="card-amount">₱0.00</span>
                    </div>
                </div>

                <!-- Income Progress & Range Panel -->
                <div class="card-panel" style="flex: 1; overflow-y: auto;">
                    <div class="section-header">
                        <h3>Income Breakdown & Progress</h3>
                        <div style="display: flex; gap: 4px; align-items: center;">
                            <select id="incomePaycheckType" class="filter-select">
                                <option value="Monthly Paycheck">Monthly</option>
                                <option value="1st Paycheck">1st Pay</option>
                                <option value="2nd Paycheck">2nd Pay</option>
                                <option value="Total Paycheck">Total</option>
                            </select>
                            <select id="incomeMonth" class="filter-select">
                                <option value="0">Jan</option>
                                <option value="1">Feb</option>
                                <option value="2">Mar</option>
                                <option value="3">Apr</option>
                                <option value="4">May</option>
                                <option value="5">Jun</option>
                                <option value="6">Jul</option>
                                <option value="7">Aug</option>
                                <option value="8">Sep</option>
                                <option value="9">Oct</option>
                                <option value="10" selected>Nov</option>
                                <option value="11">Dec</option>
                            </select>
                            <button id="editIncomeBtn" class="edit-icon-btn" title="Edit Incomes">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Date Range View Container -->
                    <div class="profile-date-range-container">
                        <div class="date-input-group">
                            <span style="font-size: 9px; font-weight: 700; color: var(--text-muted);">FROM</span>
                            <input type="date" id="rangeStartDate" disabled>
                        </div>
                        <div class="date-input-group">
                            <span style="font-size: 9px; font-weight: 700; color: var(--text-muted);">TO</span>
                            <input type="date" id="rangeEndDate" disabled>
                        </div>
                    </div>

                    <form id="profileIncomeForm" class="profile-income-form">
                        <div id="dynamicIncomeFieldsContainer" style="display: flex; flex-direction: column; gap: 6px;">
                            <!-- Dynamically injected source rows appear here -->
                        </div>

                        <div style="display: flex; gap: 8px; margin-top: 4px;">
                            <button type="button" id="addIncomeSourceBtn" class="add-btn" style="flex: 1; background: #f1f5f9; color: var(--text-primary); border: 1.5px solid var(--border-light);">+ Add Category</button>
                            <button type="button" id="removeIncomeSourceBtn" class="add-btn" style="background: #fef2f2; color: #ef4444; border: 1.5px solid #fecaca;">Delete</button>
                        </div>

                        <button type="submit" id="saveIncomeBtn" class="add-btn full-width" style="display: none;">Save Changes</button>
                    </form>

                    <div style="margin-top: 10px; border-top: 1px solid var(--border-light); padding-top: 10px;">
                        <span class="card-label" style="display: block; margin-bottom: 6px;" id="activeRangeTitleText">Active Paycheck Range</span>
                        <div id="homeIncomeProgressList" class="income-progress-list scrollable-list-container">
                            <!-- Progress bars dynamically injected here -->
                        </div>
                    </div>
                </div>

            </div>

            <!-- TAB 2: BILLS VIEW -->
            <div id="viewBills" class="tab-view">
                <div class="card-panel" style="height: 100%; display: flex; flex-direction: column;">
                    <div class="section-header">
                        <h3>Scheduled Bills</h3>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            <select id="billsFilterMonth" class="filter-select">
                                <option value="all">All Months</option>
                                <option value="0">January</option>
                                <option value="1">February</option>
                                <option value="2">March</option>
                                <option value="3">April</option>
                                <option value="4">May</option>
                                <option value="5">June</option>
                                <option value="6">July</option>
                                <option value="7">August</option>
                                <option value="8">September</option>
                                <option value="9">October</option>
                                <option value="10">November</option>
                                <option value="11">December</option>
                            </select>
                            <span id="billsTotalAmountText" style="font-size: 11px; font-weight: 800; color: #ef4444;">₱0.00</span>
                        </div>
                    </div>

                    <div class="scrollable-list-container" style="flex: 1;">
                        <ul id="billsList" class="item-list">
                            <!-- Bill rows go here -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- TAB 3: QUICK ENTRY (FULLSCREEN MENU) -->
            <div id="viewQuickEntry" class="tab-view">
                <div class="card-panel" style="height: 100%;">
                    <div class="section-header">
                        <h3>Quick Actions & Operations</h3>
                        <button id="closeFullscreenBtn" class="edit-icon-btn" title="Toggle Edit Mode">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                    </div>

                    <div class="quick-entry-menu-grid">
                        <button class="quick-action-btn" id="openBillTxModalBtn">
                            <div class="action-icon">💸</div>
                            <span class="action-name">To Be Paid / Pay Bill</span>
                        </button>
                        <button class="quick-action-btn" id="openDailyTxModalBtn">
                            <div class="action-icon">📝</div>
                            <span class="action-name">Daily Transaction / Direct Entry</span>
                        </button>
                        <button class="quick-action-btn" id="openBillEntryModalBtn">
                            <div class="action-icon">📅</div>
                            <span class="action-name">Add / Schedule New Bill</span>
                        </button>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-target="viewHome" data-title="Krazy Doom">
                <div class="nav-icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                </div>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-target="viewBills" data-title="Bills Schedule">
                <div class="nav-icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </div>
                <span>Bills</span>
            </button>
            <button class="nav-fab-btn" id="openFullscreenBtn" title="Quick Menu"></button>
        </nav>

    </div>

    <!-- MODAL 1: TO BE PAID / PAY BILL -->
    <div id="billTxModal" class="app-modal">
        <div class="modal-content">
            <div class="section-header">
                <h3 id="toBePaidModalTitle">To Be Paid</h3>
                <button class="close-modal-btn">&times;</button>
            </div>
            <form id="quickTransactionForm" class="transaction-form" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="form-row-horizontal" style="position: relative;">
                    <label for="desc">Bill Name</label>
                    <div style="position: relative; width: 100%;">
                        <input type="text" id="desc" placeholder="Select or type bill" autocomplete="off" required>
                        <button type="button" id="toggleBillsDropdownBtn" style="position: absolute; right: 4px; top: 3px; background: none; border: none; cursor: pointer; font-size: 12px; color: var(--text-muted);">▼</button>
                        <div id="quickBillsDropdown" class="custom-combobox-dropdown" style="display: none;"></div>
                    </div>
                </div>

                <div class="form-row-horizontal">
                    <label for="quickDueDate">Due Date</label>
                    <input type="date" id="quickDueDate">
                </div>

                <div class="form-row-horizontal">
                    <label for="amount">Total Amount</label>
                    <input type="text" id="amount" class="currency-input" placeholder="0.00" autocomplete="off" required>
                </div>

                <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--text-muted);">
                    <input type="checkbox" id="splitAmountCheck" style="width: 14px; height: 14px; cursor: pointer;">
                    <label for="splitAmountCheck" style="cursor: pointer;">Split payment across 2 sources</label>
                </div>

                <div class="form-row-horizontal">
                    <label for="deductSource1">Deduct From</label>
                    <select id="deductSource1" class="filter-select" style="height: 28px; width: 100%;"></select>
                </div>

                <div class="form-row-horizontal amount2-slot" id="amount2Row">
                    <label for="amount1">Split Parts</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                        <input type="text" id="amount1" class="currency-input" placeholder="Part 1" autocomplete="off">
                        <input type="text" id="amount2" class="currency-input" placeholder="Part 2" readonly style="background: #f1f5f9;">
                    </div>
                </div>

                <div class="form-row-horizontal amount2-slot" id="amount2SourceRow" style="display: grid;">
                    <label for="deductSource2">Source 2</label>
                    <select id="deductSource2" class="filter-select" style="height: 28px; width: 100%;"></select>
                </div>

                <button type="submit" id="payBillBtn" class="add-btn full-width" style="margin-top: 6px;">Pay Bill</button>
            </form>
        </div>
    </div>

    <!-- MODAL 2: DAILY TRANSACTION ENTRY -->
    <div id="dailyTxModal" class="app-modal">
        <div class="modal-content">
            <div class="section-header">
                <h3 id="dailyModalTitle">Daily</h3>
                <button class="close-modal-btn">&times;</button>
            </div>
            <form id="dailyTransactionForm" class="transaction-form" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="form-row-horizontal">
                    <label for="dailyType">Description</label>
                    <input type="text" id="dailyType" placeholder="e.g. Groceries / Income" required autocomplete="off">
                </div>
                <div class="form-row-horizontal">
                    <label for="dailyAmount">Amount</label>
                    <input type="text" id="dailyAmount" class="currency-input" placeholder="0.00" required autocomplete="off">
                </div>
                <div class="form-row-horizontal">
                    <label for="dailyCategory">Category / Source</label>
                    <select id="dailyCategory" class="filter-select" style="height: 28px; width: 100%;"></select>
                </div>
                <button type="submit" id="saveDailyBtn" class="add-btn full-width" style="margin-top: 6px;">Save Transaction</button>
            </form>
        </div>
    </div>

    <!-- MODAL 3: BILL ENTRY / SCHEDULE -->
    <div id="billEntryModal" class="app-modal">
        <div class="modal-content">
            <div class="section-header">
                <h3 id="billModalTitle">Bills</h3>
                <button class="close-modal-btn">&times;</button>
            </div>
            <form id="billForm" class="bill-form">
                <div class="form-column">
                    <div class="form-row-horizontal" style="position: relative;">
                        <label for="billName">Bill Name</label>
                        <div style="position: relative; width: 100%;">
                            <input type="text" id="billName" placeholder="Enter bill name" autocomplete="off" required>
                            <button type="button" id="toggleBillEditDropdownBtn" style="position: absolute; right: 4px; top: 3px; background: none; border: none; cursor: pointer; font-size: 12px; color: var(--text-muted); display: none;">▼</button>
                            <div id="billEditDropdown" class="custom-combobox-dropdown" style="display: none;"></div>
                        </div>
                    </div>

                    <div class="form-row-horizontal">
                        <label for="billAmount">Amount</label>
                        <input type="text" id="billAmount" class="currency-input" placeholder="0.00" autocomplete="off" required>
                    </div>

                    <div class="form-row-horizontal">
                        <label for="billDueDate">Due Date</label>
                        <input type="date" id="billDueDate" required>
                    </div>

                    <div class="recurrence-section" id="recurrenceSectionWrapper">
                        <span class="recurrence-title">Recurrence Schedule</span>
                        <div class="recurrence-options">
                            <label><input type="radio" name="recurrenceType" value="one-time" checked> One-Time</label>
                            <label><input type="radio" name="recurrenceType" value="monthly"> Monthly</label>
                            <label><input type="radio" name="recurrenceType" value="permanent"> Lifetime</label>
                        </div>
                        <div class="monthly-count-slot" id="monthlyCountRow">
                            <div class="form-row-horizontal" style="margin-top: 4px;">
                                <label for="recurrenceMonths">Months</label>
                                <input type="number" id="recurrenceMonths" value="3" min="1" max="24">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="saveBillBtn" class="add-btn full-width">Save Bill</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 4: ADD CUSTOM INCOME SOURCE -->
    <div id="incomeSourceModal" class="app-modal">
        <div class="modal-content">
            <div class="section-header">
                <h3>Add Income Source</h3>
                <button class="close-modal-btn">&times;</button>
            </div>
            <form id="customIncomeSourceForm" class="transaction-form" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="form-row-horizontal">
                    <label for="customIncomeSourceName">Name</label>
                    <input type="text" id="customIncomeSourceName" placeholder="e.g. Bank Account" required autocomplete="off">
                </div>

                <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-top: 4px;">
                    <input type="checkbox" id="enableInterestCheck" style="width: 14px; height: 14px; cursor: pointer;">
                    <label for="enableInterestCheck" style="cursor: pointer;">Enable daily interest accumulation</label>
                </div>

                <div id="interestFieldsSlot" style="display: none; flex-direction: column; gap: 8px;">
                    <div class="form-row-horizontal">
                        <label for="interestRate">Rate (%)</label>
                        <input type="number" step="0.01" id="interestRate" placeholder="e.g. 4.5">
                    </div>
                    <div class="form-row-horizontal">
                        <label for="interestPA">P.A. Days</label>
                        <input type="number" id="interestPA" value="365">
                    </div>
                    <div class="form-row-horizontal">
                        <label for="interestWHTax">WH Tax (%)</label>
                        <input type="number" id="interestWHTax" value="20">
                    </div>
                </div>

                <button type="submit" class="add-btn full-width" style="margin-top: 6px;">Add Source</button>
            </form>
        </div>
    </div>

    <!-- MODAL 5: DELETE INCOME SOURCE -->
    <div id="deleteIncomeSourceModal" class="app-modal">
        <div class="modal-content">
            <div class="section-header">
                <h3>Delete Income Source</h3>
                <button class="close-modal-btn">&times;</button>
            </div>
            <form id="deleteIncomeSourceForm" class="transaction-form" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="form-row-horizontal">
                    <label for="deleteIncomeSourceSelect">Source</label>
                    <select id="deleteIncomeSourceSelect" class="filter-select" style="height: 28px; width: 100%;"></select>
                </div>
                <button type="submit" class="add-btn full-width" style="background: #ef4444; margin-top: 6px;">Confirm Delete</button>
            </form>
        </div>
    </div>

    <!-- SYSTEM ERROR MODAL -->
    <div id="errorModal" class="app-modal">
        <div class="modal-content" style="text-align: center;">
            <div class="section-header" style="justify-content: center;">
                <h3 style="color: #ef4444;">System Alert</h3>
            </div>
            <p id="errorMessageText" style="font-size: 12px; color: var(--text-primary); margin: 6px 0;">An error occurred.</p>
            <button type="button" id="closeErrorModalBtn" class="add-btn full-width" style="background: var(--text-primary);">Dismiss</button>
        </div>
    </div>

    <!-- Script File Integration -->
    <script src="script.js"></script>
</body>
</html>
